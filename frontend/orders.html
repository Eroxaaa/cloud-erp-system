<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remodule | Wholesale ERP</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">ERP</span>
        <span>Wholesale</span>
      </div>
      <nav class="side-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="customers.html">Customers</a>
        <a class="active" href="orders.html">Orders</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <button class="menu-button" type="button" onclick="toggleSidebar()">Menu</button>
        <div>
          <h1>Remodule</h1>
          <p>ERP order processing</p>
        </div>
        <button class="btn btn-secondary" type="button" onclick="logoutUser()">Logout</button>
      </header>

      <div id="alertBox" class="alert" role="alert"></div>

      <section class="panel">
        <h2>Create Order</h2>
        <form id="orderForm" class="grid-form">
          <div>
            <label for="orderCustomerId">Customer ID</label>
            <input id="orderCustomerId" name="customer_id" type="number" min="1" required>
          </div>
          <div>
            <label for="orderProductId">Product ID</label>
            <input id="orderProductId" name="product_id" type="number" min="1" required>
          </div>
          <div>
            <label for="orderQuantity">Quantity</label>
            <input id="orderQuantity" name="quantity" type="number" min="1" required>
          </div>
          <button class="btn btn-primary" type="submit">Create Order</button>
        </form>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>Order List</h2>
          <button class="btn btn-light" type="button" onclick="loadOrders()">Refresh</button>
        </div>
        <div id="loadingSpinner" class="spinner" aria-label="Loading"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Customer ID</th>
                <th>Product ID</th>
                <th>Quantity</th>
                <th>Total Price</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
  <script>
    protectPage();
    document.getElementById("orderForm").addEventListener("submit", createOrder);
    loadOrders();
  </script>
</body>
</html>
