<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Wholesale ERP</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">ERP</span>
        <span>Wholesale</span>
      </div>
      <nav class="side-nav">
        <a class="active" href="dashboard.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="customers.html">Customers</a>
        <a href="orders.html">Orders</a>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <button class="menu-button" type="button" onclick="toggleSidebar()">Menu</button>
        <div>
          <h1>Dashboard</h1>
          <p>Business overview</p>
        </div>
        <button class="btn btn-secondary" type="button" onclick="logoutUser()">Logout</button>
      </header>

      <div id="alertBox" class="alert" role="alert"></div>
      <div id="loadingSpinner" class="spinner" aria-label="Loading"></div>

      <section class="stats-grid" aria-label="Dashboard statistics">
        <article class="stat-card">
          <span>Total Products</span>
          <strong id="totalProducts">0</strong>
        </article>
        <article class="stat-card">
          <span>Total Customers</span>
          <strong id="totalCustomers">0</strong>
        </article>
        <article class="stat-card">
          <span>Total Orders</span>
          <strong id="totalOrders">0</strong>
        </article>
        <article class="stat-card">
          <span>Total Stock</span>
          <strong id="totalStock">0</strong>
        </article>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
  <script>
    protectPage();
    loadDashboardStats();
  </script>
</body>
</html>
